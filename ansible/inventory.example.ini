; UMA — example inventory.
;
; Two host groups:
;   uma_collectors — exactly ONE host runs the central collector.
;   uma_agents     — every node that runs the per-host agent.
;
; The collector is normally NOT also an agent (you can if you want).

[uma_collectors]
collector.dc1.internal     ansible_user=ubuntu

[uma_agents]
node-01.dc1.internal       ansible_user=ubuntu
node-02.dc1.internal       ansible_user=ubuntu
proxmox-pve-ha             ansible_user=root          ansible_host=10.232.129.16
; ... add 500 more lines ...

; Optional: BMCs (out-of-band) for the configure-bmc.yml playbook.
[uma_bmcs]
ilo-node-01                bmc_address=10.232.12.220  bmc_vendor=hpe   bmc_username=monitor   bmc_password={{ vault_ilo_password }}
ilo-node-02                bmc_address=10.232.12.221  bmc_vendor=hpe   bmc_username=monitor   bmc_password={{ vault_ilo_password }}

; ===== Group variables =====

[uma_agents:vars]
uma_collector_url      = wss://collector.dc1.internal:9443/v1/ingest
uma_log_level          = info

; Optional: install the standard package set so all hardware modules activate.
; Without these the modules log "WARN: <tool> not present — disabling" and skip.
uma_install_apt_tools  = true

[uma_collectors:vars]
uma_collector_fqdn     = collector.dc1.internal
uma_collector_log_level = info

; ===== Whole-deployment vars =====

[all:vars]
; Where the cargo-built artifacts live (relative to playbook_dir or absolute).
uma_binary_dir = "{{ playbook_dir }}/../target/release"
uma_certs_dir  = "{{ playbook_dir }}/../certs/out"
uma_repo_dir   = "{{ playbook_dir }}/.."

; SAN entries beyond the FQDN that the collector cert should be valid for.
; Add the collector's IP, public DNS name, etc. here.
collector_san_extras = "10.0.0.10,collector.dc1,collector"
