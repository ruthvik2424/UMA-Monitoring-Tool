---
- name: Create collector user
  user:
    name: monitor-collector
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/monitor-collector
    create_home: true

- name: Ensure target dirs
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: monitor-collector
    group: monitor-collector
  loop:
    - /etc/monitor-collector
    - /var/lib/monitor-collector

# Fix-up in case the directory was created earlier as root (e.g. someone
# tested the collector manually before the systemd unit was installed).
# Without this, SQLite throws "attempt to write a readonly database".
- name: Re-chown collector state dir + contents (idempotent)
  file:
    path: /var/lib/monitor-collector
    state: directory
    owner: monitor-collector
    group: monitor-collector
    recurse: true

- name: Install monitor-collector binary
  copy:
    src: "{{ uma_binary_dir }}/monitor-collector"
    dest: /usr/local/bin/monitor-collector
    mode: "0755"
    owner: root
    group: root
  notify: restart monitor-collector

- name: Install systemd unit
  copy:
    src: "{{ playbook_dir }}/../systemd/monitor-collector.service"
    dest: /etc/systemd/system/monitor-collector.service
    mode: "0644"
  notify:
    - reload systemd
    - restart monitor-collector

- name: Render collector config
  template:
    src: config.toml.j2
    dest: /etc/monitor-collector/config.toml
    mode: "0640"
    owner: monitor-collector
    group: monitor-collector
  notify: restart monitor-collector

- name: Install CA cert
  copy:
    src: "{{ uma_certs_dir }}/ca.crt"
    dest: /etc/monitor-collector/ca.crt
    mode: "0644"
    owner: root
    group: monitor-collector
  notify: restart monitor-collector

- name: Install server cert
  copy:
    src: "{{ uma_certs_dir }}/{{ uma_collector_fqdn }}.server.crt"
    dest: /etc/monitor-collector/server.crt
    mode: "0640"
    owner: monitor-collector
    group: monitor-collector
  notify: restart monitor-collector

- name: Install server key
  copy:
    src: "{{ uma_certs_dir }}/{{ uma_collector_fqdn }}.server.key"
    dest: /etc/monitor-collector/server.key
    mode: "0600"
    owner: monitor-collector
    group: monitor-collector
  notify: restart monitor-collector

- name: Enable + start monitor-collector
  systemd:
    name: monitor-collector
    enabled: true
    state: started
    daemon_reload: true
