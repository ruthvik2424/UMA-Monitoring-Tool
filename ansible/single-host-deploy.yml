---
# Single-host bootstrap. Use when:
#   - You're deploying to ONE box (this VM acts as both collector + agent).
#   - The Ansible controller cannot cross-compile the Linux agent
#     (e.g. you're on macOS) — so the build must happen on the target itself.
#
# Pre-conditions (do these BEFORE running):
#   1. Source code rsynced to the target at ~/ultimate-monitoring-agent/
#   2. Certs already in ~/ultimate-monitoring-agent/certs/out/ (CA, server,
#      client) — generated locally on the controller.
#
# Run:
#   ansible-playbook -i inventory.single.ini single-host-deploy.yml --ask-become-pass
#
# Variables (override on the command line with -e):
#   target_user       SSH/sudo user on the target (default: user)
#   uma_repo_remote   Path on target where source lives (default: ~user/ultimate-monitoring-agent)

- name: UMA — single-host self-bootstrap (build on target, install both services)
  hosts: all
  gather_facts: true
  vars:
    target_user: "{{ ansible_user }}"
    uma_repo_remote: "/home/{{ target_user }}/ultimate-monitoring-agent"
    uma_release_dir: "{{ uma_repo_remote }}/target/release"

  tasks:
    # ---------- 1. System packages ----------
    - name: Install build deps + runtime tools
      become: true
      apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - pkg-config
          - build-essential
          - libssl-dev
          - libudev-dev
          - libdbus-1-dev
          - libsqlite3-dev
          # runtime tools so all modules activate:
          - smartmontools
          - nvme-cli
          - ethtool
          - ipmitool
          - lm-sensors
          - edac-utils
          - rasdaemon
          - pciutils
          - dmidecode
          - jq
          - curl
          - rsync

    # ---------- 2. Rust toolchain (one-time) ----------
    - name: Check for cargo on target
      stat:
        path: "/home/{{ target_user }}/.cargo/bin/cargo"
      register: cargo_stat

    - name: Install rustup (idempotent)
      become_user: "{{ target_user }}"
      shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
      when: not cargo_stat.stat.exists
      args:
        creates: "/home/{{ target_user }}/.cargo/bin/cargo"

    # ---------- 3. Build the workspace ----------
    - name: cargo build --release --workspace (on target)
      become_user: "{{ target_user }}"
      shell: |
        source $HOME/.cargo/env
        cargo build --release --workspace
      args:
        chdir: "{{ uma_repo_remote }}"
        executable: /bin/bash
      register: cargo_out
      changed_when: "'Compiling' in cargo_out.stderr or 'Compiling' in cargo_out.stdout"

    - name: Confirm both binaries built
      stat:
        path: "{{ item }}"
      loop:
        - "{{ uma_release_dir }}/monitor-agent"
        - "{{ uma_release_dir }}/monitor-collector"
      register: bin_stat
      failed_when: false

    - name: Fail if any binary missing
      assert:
        that: bin_stat.results | map(attribute='stat.exists') | list | min
        fail_msg: "Build did not produce both binaries. Check cargo output above."

    # ---------- 4. Collector — user, dirs, certs, config, unit ----------
    - name: Create monitor-collector system user
      become: true
      user:
        name: monitor-collector
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/monitor-collector
        create_home: true

    - name: Create collector dirs
      become: true
      file:
        path: "{{ item }}"
        state: directory
        owner: monitor-collector
        group: monitor-collector
        mode: "0755"
      loop:
        - /etc/monitor-collector
        - /var/lib/monitor-collector

    - name: Re-chown collector state dir (in case it pre-existed as root)
      become: true
      file:
        path: /var/lib/monitor-collector
        owner: monitor-collector
        group: monitor-collector
        recurse: true

    - name: Install collector binary
      become: true
      copy:
        src: "{{ uma_release_dir }}/monitor-collector"
        dest: /usr/local/bin/monitor-collector
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Install collector CA
      become: true
      copy:
        src: "{{ uma_repo_remote }}/certs/out/ca.crt"
        dest: /etc/monitor-collector/ca.crt
        remote_src: true
        owner: root
        group: monitor-collector
        mode: "0644"

    - name: Install collector server cert
      become: true
      copy:
        src: "{{ uma_repo_remote }}/certs/out/{{ ansible_hostname }}.server.crt"
        dest: /etc/monitor-collector/server.crt
        remote_src: true
        owner: monitor-collector
        group: monitor-collector
        mode: "0640"

    - name: Install collector server key
      become: true
      copy:
        src: "{{ uma_repo_remote }}/certs/out/{{ ansible_hostname }}.server.key"
        dest: /etc/monitor-collector/server.key
        remote_src: true
        owner: monitor-collector
        group: monitor-collector
        mode: "0600"

    - name: Render collector config
      become: true
      copy:
        dest: /etc/monitor-collector/config.toml
        owner: monitor-collector
        group: monitor-collector
        mode: "0640"
        content: |
          # Managed by Ansible — do not edit by hand.
          bind_ingest = "0.0.0.0:9443"
          bind_gui    = "0.0.0.0:8443"
          db_path         = "/var/lib/monitor-collector/collector.sqlite"
          retention_days  = 30
          offline_after_s = 10
          log_level       = "info"

          [tls]
          ca_cert     = "/etc/monitor-collector/ca.crt"
          server_cert = "/etc/monitor-collector/server.crt"
          server_key  = "/etc/monitor-collector/server.key"
          require_client_cert = true

    - name: Install collector systemd unit
      become: true
      copy:
        src: "{{ uma_repo_remote }}/systemd/monitor-collector.service"
        dest: /etc/systemd/system/monitor-collector.service
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    # ---------- 5. Agent — dirs, certs, config, unit ----------
    - name: Create agent dirs
      become: true
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /etc/monitor-agent
        - /var/lib/monitor-agent

    - name: Install agent binary
      become: true
      copy:
        src: "{{ uma_release_dir }}/monitor-agent"
        dest: /usr/local/bin/monitor-agent
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Install agent CA
      become: true
      copy:
        src: "{{ uma_repo_remote }}/certs/out/ca.crt"
        dest: /etc/monitor-agent/ca.crt
        remote_src: true
        mode: "0644"

    - name: Install agent client cert
      become: true
      copy:
        src: "{{ uma_repo_remote }}/certs/out/{{ ansible_hostname }}.client.crt"
        dest: /etc/monitor-agent/client.crt
        remote_src: true
        mode: "0644"

    - name: Install agent client key
      become: true
      copy:
        src: "{{ uma_repo_remote }}/certs/out/{{ ansible_hostname }}.client.key"
        dest: /etc/monitor-agent/client.key
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: Render agent config
      become: true
      copy:
        dest: /etc/monitor-agent/config.toml
        mode: "0640"
        owner: root
        group: root
        content: |
          # Managed by Ansible — do not edit by hand.
          [agent]
          log_level = "info"

          [collector]
          # Same host runs both collector and agent.
          url = "wss://{{ ansible_hostname }}:9443/v1/ingest"
          keepalive_s = 5

          [tls]
          ca_cert     = "/etc/monitor-agent/ca.crt"
          client_cert = "/etc/monitor-agent/client.crt"
          client_key  = "/etc/monitor-agent/client.key"

          [heartbeat]
          interval_s = 5

          [dedup]
          re_notify_after_s = 1800
          recovery_window_s = 60

          [tags]
          dc   = "lab"
          role = "librenms-host"

          [modules.thermal]
          enabled = true
          inlet_warn_c      = 32.0
          inlet_critical_c  = 36.0
          inlet_emergency_c = 38.0

          [modules.network_nic]
          enabled = true
          flap_window_s  = 10
          flap_threshold = 2

          [modules.lifecycle]
          enabled = true
          [modules.boot]
          enabled = true

    - name: Install agent systemd unit
      become: true
      copy:
        src: "{{ uma_repo_remote }}/systemd/monitor-agent.service"
        dest: /etc/systemd/system/monitor-agent.service
        remote_src: true
        owner: root
        group: root
        mode: "0644"

    # ---------- 6. Enable + start services ----------
    - name: systemctl daemon-reload
      become: true
      systemd:
        daemon_reload: true

    - name: Enable + restart monitor-collector
      become: true
      systemd:
        name: monitor-collector
        enabled: true
        state: restarted

    - name: Wait for collector ports
      wait_for:
        host: "127.0.0.1"
        port: "{{ item }}"
        timeout: 15
      loop: [9443, 8443]

    - name: Enable + restart monitor-agent
      become: true
      systemd:
        name: monitor-agent
        enabled: true
        state: restarted

    - name: Brief settle pause
      pause:
        seconds: 4

    - name: Show service status (collector)
      become: true
      command: systemctl status monitor-collector --no-pager -l
      register: coll_st
      changed_when: false
    - debug:
        msg: "{{ coll_st.stdout_lines[:14] }}"

    - name: Show service status (agent)
      become: true
      command: systemctl status monitor-agent --no-pager -l
      register: ag_st
      changed_when: false
    - debug:
        msg: "{{ ag_st.stdout_lines[:14] }}"

    - name: GUI URL
      debug:
        msg: |
          UMA is up. Open the GUI at:
            https://{{ ansible_default_ipv4.address }}:8443
            (or https://{{ ansible_hostname }}:8443 if your DNS resolves it)
          Accept the self-signed CA warning in the browser.
