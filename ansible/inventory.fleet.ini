; UMA — fleet inventory using build-once / deploy-many.
;
; Three groups:
;   uma_builder    — exactly ONE Linux host that compiles the binaries.
;                    Its glibc determines the minimum supported glibc on
;                    agent hosts. Pick the OLDEST distro you'll deploy to
;                    (typically Ubuntu 22.04 if your fleet is mixed 22/24).
;                    Doesn't have to also run the agent.
;   uma_collectors — host(s) that run the central collector + GUI.
;   uma_agents     — every node that runs the per-host agent.
;
; A single host can appear in multiple groups (e.g. the builder also runs
; the collector and the agent — fine for small / single-host setups).

[uma_builder]
LibreNMS-Host  ansible_host=10.240.19.245  ansible_user=user

[uma_collectors]
LibreNMS-Host  ansible_host=10.240.19.245  ansible_user=user

[uma_agents]
LibreNMS-Host  ansible_host=10.240.19.245  ansible_user=user
C2-DH2-R54-CO-S480  ansible_host=10.240.33.230  ansible_user=user
C2-DH2-R52-CO-S469  ansible_host=10.240.33.219  ansible_user=user
C2-DH2-R53-CO-S479  ansible_host=10.240.33.229  ansible_user=user
C2-DH2-R43-GP-S393  ansible_host=10.240.33.143  ansible_user=user

; Add more agent hosts below — just point them at the collector URL.
; node-01.dc1.internal  ansible_host=10.0.0.11  ansible_user=ubuntu
; node-02.dc1.internal  ansible_host=10.0.0.12  ansible_user=ubuntu
; proxmox-pve-ha        ansible_host=10.232.129.16  ansible_user=root

[uma_agents:vars]
uma_collector_url=wss://10.240.19.245:9443/v1/ingest

[uma_collectors:vars]
; Extra DNS names / IPs the collector cert should be valid for, beyond
; inventory_hostname. Agents must reach the collector via one of these.
collector_san_extras=10.240.19.245 LibreNMS-Host localhost 127.0.0.1

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
