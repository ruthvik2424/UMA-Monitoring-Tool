; UMA — agent-only inventory.
; Use with single-host-agent-only.yml (or scale to many hosts).
;
; Each host in [uma_agents] gets the agent installed and points at
; uma_collector_url defined below.
;
; Add new hosts here as you bring them online.

[uma_agents]
; Examples — replace with your real hosts:
; node-01.dc1.internal  ansible_host=10.0.0.11  ansible_user=ubuntu
; node-02.dc1.internal  ansible_host=10.0.0.12  ansible_user=ubuntu
; proxmox-pve-ha        ansible_host=10.232.129.16  ansible_user=root
LibreNMS-Host           ansible_host=10.240.19.245  ansible_user=user

[uma_agents:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'

; Where the agents should send alerts. Replace with your collector's URL.
uma_collector_url=wss://collector.dc1.internal:9443/v1/ingest

; Optional global tags applied to every agent in this group.
uma_dc=dc1
uma_role=baremetal
