[package]
name = "uma-collector"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["v3"]
v1 = []                                    # v1.0.0: Base collector only
v2 = ["v1", "webhooks", "notifications"]   # v2.0.0: v1 + webhooks + desktop notifications
v3 = ["v2", "maintenance", "debug-http"]   # v3.0.0: v2 + maintenance mode + debug features
webhooks = []          # Slack/Google Chat integrations
notifications = []     # Desktop notification support  
maintenance = []       # Maintenance mode support
debug-http = []        # Debug HTTP endpoint

[[bin]]
name = "monitor-collector"
path = "src/main.rs"

[dependencies]
uma-shared = { path = "../shared" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ulid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true

axum.workspace = true
axum-server.workspace = true
tower.workspace = true
tower-http.workspace = true
sqlx.workspace = true

rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
rustls-webpki.workspace = true
reqwest.workspace = true

regex.workspace = true
once_cell.workspace = true
toml.workspace = true
clap.workspace = true
uuid.workspace = true
