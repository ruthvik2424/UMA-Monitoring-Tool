[workspace]
resolver = "2"
members = [
    "shared",
    "agent",
    "collector",
]

[workspace.package]
version = "4.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["UMA Team"]
rust-version = "1.85"
repository = "https://github.com/ruthvik2424/UMA-Monitoring-Tool"
description = "Ultra-low latency bare-metal hardware monitoring for large server fleets"
keywords = ["monitoring", "bare-metal", "hardware", "alerting", "rust"]
categories = ["network-programming", "hardware-support"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.9"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1.1", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
bytes = "1.7"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["full"] }
async-trait = "0.1"
parking_lot = "0.12"

# Networking / TLS
tokio-tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
tungstenite = { version = "0.24", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
rustls-webpki = "0.102"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Server
axum = { version = "0.7", features = ["ws", "macros"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "macros", "json"] }

# Linux specifics
nix = { version = "0.29", features = ["fs", "signal", "socket", "process", "user"] }
rtnetlink = "0.14"
netlink-packet-route = "0.19"
netlink-sys = "0.8"
udev = "0.9"
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

# Utilities
regex = "1.10"
once_cell = "1.20"
toml = "0.8"
hostname = "0.4"
machine-uid = "0.5"
walkdir = "2.5"
glob = "0.3"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
